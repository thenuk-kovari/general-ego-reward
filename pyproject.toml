[project]
name = "ego-progress"
version = "0.1.0"
description = "Zero-shot VLM reward scoring for egocentric video windows"
requires-python = ">=3.10"
dependencies = [
  "gradio>=5.0.0",
  "openai>=1.0.0",
  "opencv-python-headless>=4.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["ego_progress*"]
